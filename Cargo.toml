[package]
name = "robertos-watching-bot"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "throttle", "rustls", "ctrlc_handler"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }   # sin "cookies" (A-10)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }

zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
thiserror = "2.0.21"
anyhow = "1.0.104"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
